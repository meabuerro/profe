<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Capturas · Profe</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f6f7fb; }
  iframe { display: block; border: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!--
  Página de apoyo para las capturas del README.

  Carga la app en un iframe del mismo origen, rellena un expediente de ejemplo
  (centro y docente ficticios) y abre la vista pedida. La usa
  scripts/capturas.py con Chrome headless; no forma parte de la aplicación.

  Parámetros: vista, etapa, curso, materia, ccaa, demo (0 desactiva el ejemplo),
  expandir
-->
<iframe id="frame" src="../index.html"></iframe>
<script>
const params = new URLSearchParams(location.search);
const vista = params.get("vista") || "panel";
const etapa = params.get("etapa") || "eso";
const curso = params.get("curso") || "2º ESO";
const materia = params.get("materia") || "biologia-y-geologia";
const ccaa = params.get("ccaa") || "andalucia";
const demo = params.get("demo") !== "0";
const zoom = Number(params.get("zoom")) || 1;
const expandir = params.get("expandir") === "1";

// Contenido de ejemplo: no es currículo, es la contextualización que pone el docente.
const CONTEXTO = "Grupo de 28 alumnos y alumnas de 2.º de ESO, con dos estudiantes " +
  "incorporados a mitad de curso y tres con medidas de refuerzo en lengua. El centro " +
  "participa en el programa de huerto escolar, lo que permite trabajar el entorno " +
  "cercano y el método científico con salidas periódicas.";
const TITULOS = [
  "La célula, unidad de vida",
  "Nutrición y salud",
  "El sistema nervioso",
  "Reproducción y herencia",
  "La Tierra cambia",
  "Minerales y rocas",
  "Volcanes y terremotos",
  "Ecosistemas y huerto",
  "Proyecto: salud y entorno"
];
const INSTRUMENTOS = ["Rúbrica", "Prueba escrita", "Observación",
  "Informe", "Exposición", "Proyecto"];

const frame = document.getElementById("frame");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

frame.addEventListener("load", async () => {
  const w = frame.contentWindow;
  const d = w.document;
  const q = (sel) => d.querySelector(sel);
  const qa = (sel) => Array.from(d.querySelectorAll(sel));

  const setSelect = (sel, valor) => {
    const el = q(sel);
    if (!el) return false;
    el.value = valor;
    el.dispatchEvent(new w.Event("change", { bubbles: true }));
    return true;
  };
  const escribir = (sel, valor) => {
    const el = q(sel);
    if (!el) return false;
    el.value = valor;
    el.dispatchEvent(new w.Event("input", { bubbles: true }));
    return true;
  };
  const pulsar = (sel) => {
    const el = q(sel);
    if (!el) return false;
    el.click();
    return true;
  };
  const guardado = () => JSON.parse(w.localStorage.getItem("profe.state.v1") || "{}");

  // Contextualización, unidades con título e instrumentos y una situación evaluable:
  // lo justo para que el expediente se vea como el de un docente que ya lo ha trabajado.
  async function completarExpediente() {
    pulsar('[data-nav="didactica"]');
    await wait(250);
    escribir('#view textarea[data-bind="didactica.contexto"]', CONTEXTO);
    await wait(200);

    pulsar('[data-nav="anual"]');
    await wait(250);
    for (let i = 0; i < TITULOS.length; i += 1) {
      escribir(`#view input[data-bind="anual.${i}.titulo"]`, TITULOS[i]);
      await wait(60);
      escribir(`#view input[data-bind="anual.${i}.instrumentos"]`, INSTRUMENTOS[i % INSTRUMENTOS.length]);
      await wait(60);
    }

    pulsar('[data-nav="situaciones"]');
    await wait(250);
    pulsar('[data-action="new-sit"]');
    await wait(250);
    pulsar('[data-action="sit-cargar"]');
    await wait(200);
    escribir('#view input[data-bind="situaciones.0.titulo"]', "¿Por qué enfermamos más en invierno?");
    await wait(80);
    escribir('#view input[data-bind="situaciones.0.producto"]', "Campaña de hábitos saludables para el centro");
    await wait(80);
    escribir('#view textarea[data-bind="situaciones.0.reto"]',
      "El centro detecta un aumento de ausencias por resfriados en el primer trimestre. " +
      "El alumnado debe investigar qué factores influyen en la transmisión de enfermedades " +
      "y proponer medidas para el centro.");
    await wait(80);
    qa('#view input[data-check="situaciones.0.competenciasClave"]').slice(0, 3)
      .forEach((c) => { c.checked = true; c.dispatchEvent(new w.Event("change", { bubbles: true })); });
    await wait(150);
    pulsar('[data-action="sugerir-secuencia"]');
    await wait(200);
  }

  try {
    w.localStorage.clear();
    await wait(200);

    // Sin transiciones ni animaciones: la captura es determinista.
    const estilo = d.createElement("style");
    estilo.textContent = "*,*::before,*::after{transition:none!important;animation:none!important;caret-color:transparent!important}";
    d.head.appendChild(estilo);

    // Las tablas anchas (programación anual) se fotografían con algo menos de zoom
    // para que se vean todas sus columnas.
    if (zoom !== 1) d.documentElement.style.zoom = String(zoom);

    setSelect('[data-change="perfil.etapa"]', etapa);
    await wait(90);
    setSelect('[data-change="perfil.curso"]', curso);
    await wait(90);
    setSelect('[data-change="perfil.materia"]', materia);
    await wait(90);
    setSelect('[data-change="perfil.ccaa"]', ccaa);
    await wait(140);

    // Datos de cabecera: un centro y una docente de ejemplo, no del usuario real.
    escribir('#view input[data-bind="perfil.centro"]', "IES Ramón y Cajal");
    escribir('#view input[data-bind="perfil.docente"]', "Lucía Ferrer");
    escribir('#view input[data-bind="perfil.cursoEscolar"]', "2026/2027");
    await wait(120);

    // Expediente completo a partir del currículo de la ficha.
    pulsar('[data-action="borrador"]');
    await wait(500);

    if (demo) await completarExpediente();
    await wait(200);

    pulsar(`[data-nav="${vista}"]`);
    await wait(350);

    // Despliegue opcional de la primera unidad de la programación anual.
    if (expandir && vista === "anual") {
      pulsar('[data-action="toggle-unidad"]');
      await wait(250);
    }

    // Nada de selección de texto ni de foco visible: la captura debe verse limpia.
    const seleccion = w.getSelection();
    if (seleccion) seleccion.removeAllRanges();
    if (d.activeElement && d.activeElement.blur) d.activeElement.blur();

    // Todo arriba del todo: la captura debe empezar por la cabecera.
    w.scrollTo(0, 0);
    const scroller = q("main") || q(".view") || d.scrollingElement;
    if (scroller) scroller.scrollTop = 0;
    if (d.scrollingElement) d.scrollingElement.scrollTop = 0;

    const tabla = q("#view .table-wrap");
    if (tabla) document.body.dataset.medidas = `caja=${tabla.clientWidth} contenido=${tabla.scrollWidth}`;

    const activo = d.querySelector('[data-nav][aria-current="page"]');
    document.body.dataset.activo = activo ? activo.dataset.nav : "ninguno";
    const estado = guardado();
    document.body.dataset.resumen = [
      estado.anual ? estado.anual.length + " unidades" : "sin anual",
      estado.situaciones ? estado.situaciones.length + " situaciones" : "sin situaciones",
      estado.didactica && estado.didactica.contexto ? "contexto ok" : "sin contexto"
    ].join(" · ");
    document.title = "LISTO " + vista;
  } catch (error) {
    document.title = "ERROR " + error.message;
  }
});
</script>
</body>
</html>
