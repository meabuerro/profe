  // ---------- Eventos ----------
  document.addEventListener("click", (event) => {
    const navBtn = event.target.closest("[data-nav]");
    if (navBtn) {
      state.vista = navBtn.dataset.nav;
      save();
      render();
      focusTitulo();
      return;
    }

    const actionBtn = event.target.closest("[data-action]");
    if (!actionBtn) return;
    const {action} = actionBtn.dataset;
    const i = Number(actionBtn.dataset.i);

    switch (action) {
      case "ir-panel": state.vista = "panel"; break;
      case "ir-anual": state.vista = "anual"; break;
      case "ir-didactica": state.vista = "didactica"; break;
      case "ir-situaciones": state.vista = "situaciones"; break;
      case "ir-catalogo": state.vista = "catalogo"; break;
      case "ir-vista": state.vista = actionBtn.dataset.vista; break;
      case "sit-a-anual": {
        const sit = state.situaciones.find((s) => s.id === actionBtn.dataset.id);
        if (!sit || !sit.titulo.trim()) { toast("Ponle un título a la situación antes de añadirla."); return; }
        if (state.anual.some((u) => u.titulo === sit.titulo)) {
          toast("Esa situación ya está en la programación anual.");
          return;
        }
        const total = state.anual.length + 1;
        state.anual.push({
          id: uid(),
          titulo: sit.titulo,
          trimestre: trimestreDe(state.anual.length, total),
          competencias: sit.competenciasEsp || "",
          criterios: sit.criterios || "",
          saberes: sit.saberes || "",
          instrumentos: sit.evaluacion || "",
          sesiones: 0,
          peso: 0
        });
        toast(`«${sit.titulo}» añadida a la programación anual.`);
        break;
      }

      case "sugerir": {
        const campo = actionBtn.dataset.campo;
        const texto = propuesta(campo);
        if (!texto) { toast("No hay propuesta disponible para esta etapa."); return; }
        const actual = String(getPath(`didactica.${campo}`) || "").trim();
        if (actual && !confirm("Se sustituirá el texto que ya has escrito en este apartado. ¿Continuar?")) return;
        setPath(`didactica.${campo}`, texto);
        toast("Propuesta insertada. Adáptala a tu grupo.");
        break;
      }
      case "cargar-criterios": {
        const modelo = modeloParaCurso();
        const lineas = Object.entries(modelo.criterios).map(([ceId, lista]) =>
          `${ceId.toUpperCase()}: ${lista.join("; ")}`);
        if (!lineas.length) { toast("Esta ficha no incluye criterios de evaluación."); return; }
        if (String(getPath("didactica.criteriosTexto") || "").trim()
            && !confirm("Se sustituirán los criterios escritos por los de la ficha. ¿Continuar?")) return;
        setPath("didactica.criteriosTexto", lineas.join("\n"));
        toast(`${lineas.length} bloques de criterios cargados.`);
        break;
      }
      case "sit-cargar": {
        const base = actionBtn.dataset.base;
        const modelo = modeloParaCurso();
        const marcadas = (state.didactica.competencias || []).map((id) => String(id).toLowerCase());
        const disponibles = modelo.competencias || [];
        const elegidas = (marcadas.length
          ? disponibles.filter((ce) => marcadas.includes(String(ce.id).toLowerCase()))
          : disponibles).slice(0, 3);
        if (!elegidas.length) { toast("La ficha no tiene competencias específicas."); return; }
        if (String(getPath(`${base}.criterios`) || "").trim()
            && !confirm("Se sustituirán los criterios escritos. ¿Continuar?")) return;
        const textos = elegidas.flatMap((ce) => (modelo.criterios[ce.id] || []).slice(0, 2));
        setPath(`${base}.competenciasEsp`, elegidas.map((ce) => ce.id.toUpperCase()).join(", "));
        setPath(`${base}.criterios`, textos.join("; "));
        toast(`Competencias y criterios de ${elegidas.length} CE cargados.`);
        break;
      }
      case "cargar-criterios-ce": {
        const modelo = modeloParaCurso();
        const seleccionadas = state.didactica.competencias || [];
        const lineas = seleccionadas
          .map((id) => {
            const lista = modelo.criterios[id] || [];
            return lista.length ? `${id.toUpperCase()}: ${lista.join("; ")}` : "";
          })
          .filter(Boolean);
        if (!lineas.length) { toast("Marca antes alguna competencia específica."); return; }
        if (String(getPath("didactica.criteriosTexto") || "").trim()
            && !confirm("Se sustituirán los criterios escritos por los de la ficha. ¿Continuar?")) return;
        setPath("didactica.criteriosTexto", lineas.join("\n"));
        toast(`${lineas.length} bloques de criterios cargados de las CE marcadas.`);
        break;
      }
      case "cargar-saberes": {
        const modelo = modeloParaCurso();
        if (!modelo.saberes.length) { toast("Esta ficha no incluye saberes básicos."); return; }
        if (String(getPath("didactica.saberesTexto") || "").trim()
            && !confirm("Se sustituirán los saberes escritos por los de la ficha. ¿Continuar?")) return;
        setPath("didactica.saberesTexto", modelo.saberes.map((s) => `- ${s}`).join("\n"));
        toast(`${modelo.saberes.length} saberes cargados.`);
        break;
      }
      case "borrador": {
        if (!perfilCompleto()) {
          toast("Completa etapa, curso, materia y comunidad antes de generar el borrador.");
          return;
        }
        if ((state.didactica.criteriosTexto || state.anual.length) &&
            !confirm("Se completarán los apartados vacíos y se generarán las unidades. " +
                     "Lo que ya has escrito no se modifica. ¿Continuar?")) return;
        generarBorrador();
        break;
      }
      case "toggle-unidad": {
        const id = actionBtn.dataset.id;
        state.unidadAbierta = state.unidadAbierta === id ? null : id;
        break;
      }
      case "cubrir-ce": {
        const modelo = modeloParaCurso();
        const criterios = modelo.criterios || {};
        const contar = (u) => String(u.competencias || "").split(/[,;]+/).filter((x) => x.trim()).length;
        let anadidas = 0;
        modelo.competencias.forEach((ce) => {
          const yaEsta = state.anual.some((u) =>
            String(u.competencias || "").toLowerCase().split(/[,;]+/)
              .map((x) => x.trim()).includes(ce.id.toLowerCase()));
          if (yaEsta) return;
          const destino = state.anual.slice().sort((a, b) => contar(a) - contar(b))[0];
          if (!destino) return;
          destino.competencias = [String(destino.competencias || "").trim(), ce.id.toUpperCase()]
            .filter(Boolean).join(", ");
          const textos = (criterios[ce.id] || []).slice(0, 2);
          if (textos.length) {
            destino.criterios = [String(destino.criterios || "").trim(), textos.join("; ")]
              .filter(Boolean).join("; ");
          }
          anadidas += 1;
        });
        toast(anadidas
          ? `${anadidas} competencias repartidas entre las unidades.`
          : "Todas las competencias específicas ya están trabajadas.");
        break;
      }
      case "repartir-pesos": {
        const n = state.anual.length;
        if (!n) { toast("Añade alguna unidad antes de repartir los pesos."); return; }
        const base = Math.floor((100 / n) * 10) / 10;
        state.anual.forEach((u) => { u.peso = base; });
        const resto = Math.round((100 - base * n) * 10) / 10;
        state.anual[n - 1].peso = Math.round((base + resto) * 10) / 10;
        toast("Pesos repartidos al 100 %.");
        break;
      }
      case "dup-sit": {
        const original = state.situaciones.find((s) => s.id === actionBtn.dataset.id);
        if (!original) return;
        const copia = JSON.parse(JSON.stringify(original));
        copia.id = uid();
        copia.titulo = (copia.titulo || "Situación") + " (copia)";
        const pos = state.situaciones.indexOf(original) + 1;
        state.situaciones.splice(pos, 0, copia);
        state.situacionAbierta = copia.id;
        toast("Situación duplicada.");
        break;
      }
      case "sugerir-secuencia": {
        const sit = state.situaciones[Number(actionBtn.dataset.i)];
        if (!sit) return;
        sit.fases = {
          motivacion: "Presentación del reto a partir de una situación cercana al alumnado. Lluvia de ideas, detección de conocimientos previos y formulación de preguntas de investigación.",
          desarrollo: "Investigación guiada en equipos con reparto de roles. Búsqueda y contraste de información, prácticas o talleres, y puesta en común parcial para ajustar el trabajo.",
          aplicacion: `Elaboración del producto final${sit.producto ? ` (${sit.producto})` : ""} y preparación de la presentación al grupo. Revisión entre iguales con una lista de cotejo.`,
          evaluacion: "Presentación del producto, valoración con la rúbrica y reflexión individual sobre lo aprendido y sobre el proceso de trabajo en equipo."
        };
        toast("Secuencia insertada. Ajusta tiempos y agrupamientos.");
        break;
      }

      case "regen-anual":
        if (state.anual.length && !confirm("Se sustituirá la tabla actual por una nueva estructura. ¿Continuar?")) return;
        generarAnual();
        toast(`Estructura de ${state.anual.length} unidades generada.`);
        break;
      case "add-anual":
        state.anual.push({id: uid(), titulo: "", trimestre: "3.ª evaluación", competencias: "", criterios: "", saberes: "", instrumentos: "", sesiones: 0, peso: 0});
        break;
      case "dup-anual":
        state.anual.splice(i + 1, 0, Object.assign({}, state.anual[i], {id: uid()}));
        break;
      case "del-anual":
        state.anual.splice(i, 1);
        break;

      case "new-sit": nuevaSituacion(); break;
      case "toggle-sit":
        state.situacionAbierta = state.situacionAbierta === actionBtn.dataset.id ? null : actionBtn.dataset.id;
        break;
      case "del-sit":
        if (!confirm("¿Eliminar esta situación de aprendizaje?")) return;
        state.situaciones = state.situaciones.filter((s) => s.id !== actionBtn.dataset.id);
        if (state.situacionAbierta === actionBtn.dataset.id) state.situacionAbierta = null;
        break;

      case "add-peso":
        state.didactica.calificacion.push({nombre: "", instrumento: "Rúbrica", peso: 0});
        break;
      case "del-peso":
        state.didactica.calificacion.splice(i, 1);
        break;

      case "cat-etapa":
        state.catalogo.etapa = actionBtn.dataset.id;
        state.catalogo.id = "";
        break;
      case "cat-materia":
        state.catalogo.id = actionBtn.dataset.id;
        break;

      case "export-json": exportarJSON(); return;
      case "export-word": exportarWord(); return;
      case "export-html": exportarHTML(); return;
      case "import-json": document.getElementById("import-file").click(); return;
      case "reset":
        if (!confirm("Se borrará todo el trabajo guardado en este navegador. ¿Continuar?")) return;
        localStorage.removeItem(STORAGE_KEY);
        state = statePorDefecto();
        toast("Expediente reiniciado.");
        break;
      case "print": exportarHTML(); return;
      default: return;
    }
    save();
    render();
  });

  document.addEventListener("input", (event) => {
    const input = event.target.closest("[data-bind]");
    if (!input) return;
    const path = input.dataset.bind;
    let value = input.value;
    if (input.type === "number") value = value === "" ? "" : Number(value);
    setPath(path, value);
    save();
    if (path === "didactica.calificacion" || path.endsWith(".peso")) actualizarPesos();
    if (path === "anual" || path.startsWith("anual.")) actualizarTotalesAnual();
  });

  function actualizarPesos() {
    const pill = document.querySelector('.card-head .pill.pill-ok, .card-head .pill.pill-warn');
    if (!pill) return;
    const total = totalPesos();
    pill.textContent = `Total ${total} %`;
    pill.className = `pill ${total === 100 ? "pill-ok" : "pill-warn"}`;
  }

  function actualizarTotalesAnual() {
    const total = state.anual.reduce((s, u) => s + (Number(u.peso) || 0), 0);
    const hint = document.querySelector('[data-total-anual]');
    if (hint) hint.textContent = `${total} %`;
  }

  document.addEventListener("change", (event) => {
    const select = event.target.closest("[data-change]");
    if (select) {
      setPath(select.dataset.change, select.value);
      save();
      render();
      return;
    }
    const check = event.target.closest("[data-check]");
    if (check) {
      const path = check.dataset.check;
      const list = getPath(path) || [];
      const value = check.value;
      setPath(path, check.checked ? Array.from(new Set([...list, value])) : list.filter((v) => v !== value));
      save();
      const counter = document.querySelector(".card-head .pill.pill-mute");
      if (counter && path === "didactica.competencias") counter.textContent = `${getPath(path).length} seleccionadas`;
    }
    const file = event.target.closest("#import-file");
    if (file && file.files && file.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(String(reader.result));
          if (!imported || typeof imported !== "object") throw new Error("formato no válido");
          state = Object.assign(statePorDefecto(), imported);
          save();
          render();
          toast("Copia importada correctamente.");
        } catch (err) {
          toast("No se pudo importar: el archivo no es una copia válida de Profe.");
        }
      };
      reader.readAsText(file.files[0]);
      file.value = "";
    }
  });

  window.addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
      event.preventDefault();
      save();
      toast("Guardado.");
    }
  });

  // ---------- Arranque ----------
  if (!DATA.etapas || !DATA.etapas.length) {
    view().innerHTML = `
      <div class="card"><div class="card-body">
        <h2>No se pudo cargar el catálogo curricular</h2>
        <p class="small muted" style="margin-top:8px">Falta <code>data/app-data.js</code>. Ejecuta <code>python3 scripts/build_app.py</code> o lanza la app con el comando <code>Profe</code>.</p>
      </div></div>`;
    return;
  }

  render();
})();
</script>
</body>
</html>
