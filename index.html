<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profe · Programación docente LOMLOE</title>
<meta name="description" content="Herramienta local para diseñar la programación anual, las programaciones didácticas y las situaciones de aprendizaje conforme a la LOMLOE.">
<style>
  :root{
    --bg:#f6f7fb;
    --surface:#ffffff;
    --surface-2:#f2f4f9;
    --ink:#131722;
    --ink-2:#4a5468;
    --ink-3:#78829a;
    --line:#e3e7f0;
    --line-strong:#ccd3e0;
    --brand:#4353e8;
    --brand-ink:#2c39b8;
    --brand-soft:#eef0ff;
    --ok:#137a4d;
    --ok-soft:#e6f6ee;
    --warn:#9a5b00;
    --warn-soft:#fdf3e0;
    --danger:#b42318;
    --danger-soft:#fdeceb;
    --sidebar:#161a26;
    --sidebar-ink:#c9cfdd;
    --sidebar-ink-2:#8891a8;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -16px rgba(16,24,40,.28);
    --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em;line-height:1.25}
  h1{font-size:26px}
  h2{font-size:19px}
  h3{font-size:16px}
  p{margin:0}
  a{color:var(--brand)}
  button{font:inherit;color:inherit}
  ::selection{background:#d8dcff}

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100vh}

  .sidebar{
    background:var(--sidebar);color:var(--sidebar-ink);
    display:flex;flex-direction:column;gap:4px;
    padding:20px 14px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(145deg,#5b6cff,#3a46d6);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;
    box-shadow:0 6px 16px -8px #4a58ff;
  }
  .brand-name{color:#fff;font-weight:650;font-size:16px;letter-spacing:-.01em}
  .brand-sub{font-size:11.5px;color:var(--sidebar-ink-2);margin-top:-2px}

  .nav-group{margin-top:14px}
  .nav-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--sidebar-ink-2);padding:0 10px 6px;font-weight:600;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:9px 10px;border-radius:9px;border:0;background:transparent;
    color:var(--sidebar-ink);font-size:14px;text-align:left;cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .nav-item:hover{background:#222838;color:#fff}
  .nav-item[aria-current="page"]{background:#2a3150;color:#fff;font-weight:600}
  .nav-item .ico{width:18px;height:18px;flex:none;opacity:.9}
  .nav-item .badge{
    margin-left:auto;font-size:11px;background:#2f3752;color:#c9cfdd;
    border-radius:999px;padding:1px 7px;font-weight:600;
  }
  .nav-item[aria-current="page"] .badge{background:#4353e8;color:#fff}
  .sidebar-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid #262d40}
  .context-chip{
    background:#1d2231;border:1px solid #2a3145;border-radius:10px;
    padding:9px 10px;font-size:12.5px;color:var(--sidebar-ink);
  }
  .context-chip strong{display:block;color:#fff;font-size:13px;margin-bottom:1px}
  .context-chip span{color:var(--sidebar-ink-2)}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(246,247,251,.88);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:12px 28px;display:flex;align-items:center;gap:14px;
  }
  .crumb{font-size:13px;color:var(--ink-3)}
  .crumb strong{color:var(--ink);font-weight:600}
  .topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .save-state{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .dot.pending{background:#c9a227}

  .view{padding:26px 28px 72px;max-width:1180px;width:100%}
  .view-head{margin-bottom:20px}
  .view-head p{color:var(--ink-2);margin-top:5px;max-width:74ch;font-size:14px}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);
    color:var(--ink);padding:8px 14px;font-size:13.5px;font-weight:600;
    cursor:pointer;transition:.13s ease;white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);border-color:#b9c1d1}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
  .btn-ghost:hover{background:var(--surface-2)}
  .btn-danger{color:var(--danger);border-color:#f0c8c4}
  .btn-danger:hover{background:var(--danger-soft)}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* ---------- Cards & grid ---------- */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card-pad{padding:20px}
  .card-head{
    padding:16px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .card-head h2{font-size:16px}
  .card-head .hint{font-size:12.5px;color:var(--ink-3)}
  .card-head .grow{margin-left:auto}
  .card-body{padding:20px}
  .stack{display:flex;flex-direction:column;gap:16px}
  .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  @media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

  /* ---------- Form ---------- */
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .field .help{font-size:11.5px;color:var(--ink-3)}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:9px;
    background:var(--surface);color:var(--ink);font:inherit;font-size:14px;
    transition:border-color .12s ease,box-shadow .12s ease;
  }
  textarea{resize:vertical;min-height:84px;line-height:1.5}
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(67,83,232,.14);
  }
  input:disabled,select:disabled{background:var(--surface-2);color:var(--ink-3)}
  .check{
    display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);
    border-radius:10px;background:var(--surface);cursor:pointer;font-size:13.5px;line-height:1.45;
  }
  .check:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .check input{margin-top:3px;accent-color:var(--brand);flex:none}
  .check strong{font-weight:600}
  .check small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}

  /* ---------- Bits ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:5px;border-radius:999px;
    padding:2px 9px;font-size:11.5px;font-weight:600;border:1px solid transparent;
  }
  .pill-brand{background:var(--brand-soft);color:var(--brand-ink)}
  .pill-ok{background:var(--ok-soft);color:var(--ok)}
  .pill-warn{background:var(--warn-soft);color:var(--warn)}
  .pill-mute{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
  .muted{color:var(--ink-3)}
  .small{font-size:12.5px}
  .divider{height:1px;background:var(--line);margin:4px 0}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .list-num{padding-left:20px;color:var(--ink-2);font-size:13.5px}
  .list-num li{margin-bottom:6px}

  /* ---------- Panel / hero ---------- */
  .hero{
    background:linear-gradient(120deg,#1b2040 0%,#2a3161 52%,#3a46a8 100%);
    color:#fff;border-radius:18px;padding:28px 30px;position:relative;overflow:hidden;
    box-shadow:0 20px 50px -34px #1b2040;
  }
  .hero:after{
    content:"";position:absolute;right:-80px;top:-90px;width:320px;height:320px;
    background:radial-gradient(circle,rgba(120,138,255,.55),transparent 65%);
  }
  .hero h1{font-size:27px;max-width:22ch;position:relative}
  .hero p{margin-top:10px;color:#cdd3ee;max-width:62ch;position:relative;font-size:14.5px}
  .hero .row{margin-top:20px;position:relative}
  .hero-kicker{
    font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#a9b3e6;font-weight:700;margin-bottom:10px;position:relative;
  }
  .hero .btn{background:#fff;border-color:#fff;color:#1b2040}
  .hero .btn:hover{background:#eef0ff}
  .hero .btn-ghost{background:transparent;border-color:rgba(255,255,255,.32);color:#fff}
  .hero .btn-ghost:hover{background:rgba(255,255,255,.12)}

  .tool-card{
    display:flex;gap:14px;align-items:flex-start;text-align:left;
    padding:17px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
    cursor:pointer;transition:.14s ease;box-shadow:var(--shadow);
  }
  .tool-card:hover{border-color:#c3c9e8;transform:translateY(-1px)}
  .tool-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .tool-ico{
    width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:var(--brand-soft);color:var(--brand-ink);font-size:16px;
  }
  .tool-card h3{font-size:14.5px;margin-bottom:3px}
  .tool-card p{font-size:12.5px;color:var(--ink-2);line-height:1.45}
  .tool-card .meta{margin-top:8px;font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}

  .steps{display:flex;flex-direction:column;gap:2px}
  .step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:0}
  .step-mark{
    width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-3);
    border:1px solid var(--line-strong);margin-top:1px;
  }
  .step-mark.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .step-body{min-width:0}
  .step-body strong{font-size:13.5px;display:block}
  .step-body span{font-size:12.5px;color:var(--ink-3)}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
  th{
    background:var(--surface-2);font-size:11.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink-2);font-weight:700;white-space:nowrap;
  }
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fafbff}
  td input,td select,td textarea{border-color:transparent;background:transparent;padding:5px 7px;font-size:13.5px}
  td input:hover,td select:hover,td textarea:hover{border-color:var(--line-strong);background:#fff}
  td input:focus,td textarea:focus,td select:focus{background:#fff}
  td textarea{min-height:52px}
  .col-num{width:44px;text-align:center;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .col-actions{width:74px;text-align:right;white-space:nowrap}

  /* ---------- Empty ---------- */
  .doc-frame{
    width:100%;height:min(72vh,720px);border:1px solid var(--line);border-radius:12px;
    background:#fff;box-shadow:inset 0 1px 3px rgba(16,24,40,.05);
  }
  .req{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .req:last-child{border-bottom:0}
  .req .mark{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;margin-top:2px}
  .req .mark.ok{background:var(--ok);color:#fff}
  .req .mark.ko{background:var(--danger-soft);color:var(--danger);border:1px solid #f0c8c4}
  .req .txt{flex:1;min-width:0}
  .req .txt span{display:block;color:var(--ink-3);font-size:12px}

  .empty{
    text-align:center;padding:44px 22px;border:1px dashed var(--line-strong);
    border-radius:var(--radius);background:linear-gradient(180deg,#fcfdff,#f7f9fe);
  }
  .empty h3{font-size:15px;margin-bottom:6px}
  .empty p{color:var(--ink-3);font-size:13.5px;max-width:46ch;margin:0 auto 16px}

  /* ---------- Catálogo ---------- */
  .cat-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:980px){.cat-grid{grid-template-columns:1fr}}
  .cat-list{max-height:calc(100vh - 250px);overflow:auto;padding:8px}
  .cat-item{
    display:flex;gap:8px;align-items:center;width:100%;text-align:left;
    padding:9px 10px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-size:13.5px;
  }
  .cat-item:hover{background:var(--surface-2)}
  .cat-item.sel{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
  .cat-item .flag{margin-left:auto;font-size:10.5px;color:var(--ink-3);white-space:nowrap}
  .cat-item.sel .flag{color:var(--brand-ink)}
  .detail h3{margin-bottom:4px}
  .detail .ce{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
  .detail .ce h4{font-size:13px;color:var(--brand-ink);margin-bottom:5px}
  .detail .ce p{font-size:13px;color:var(--ink-2)}
  .detail .ce ul{margin:7px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}

  /* ---------- Situaciones ---------- */
  .sit{display:flex;gap:12px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}
  .sit:last-child{border-bottom:0}
  .sit .body{min-width:0;flex:1}
  .sit strong{font-size:14px;display:block}
  .sit span{font-size:12.5px;color:var(--ink-3)}
  .sit-edit{padding:0 20px 20px}
  .fase{border-left:3px solid var(--brand-soft);padding-left:12px}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);
    background:#131722;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.2s ease;z-index:100;
    box-shadow:0 18px 40px -20px #000;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- Print ---------- */
  @media print{
    .sidebar,.topbar,#toast,.no-print{display:none!important}
    .app{display:block}
    .view{padding:0;max-width:none}
    .card{box-shadow:none;border-color:#d7dbe4;break-inside:avoid}
    body{background:#fff}
  }
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
    .brand{padding:0 8px 0 0}
    .nav-group{margin:0;display:flex;gap:4px;flex-wrap:wrap}
    .nav-label{display:none}
    .sidebar-foot{display:none}
    .view{padding:18px 16px 60px}
    .topbar{padding:10px 16px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div>
        <div class="brand-name">Profe</div>
        <div class="brand-sub">Programación LOMLOE</div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Planificación</div>
      <button class="nav-item" data-nav="panel" aria-current="page"><span class="ico">▦</span>Panel</button>
      <button class="nav-item" data-nav="anual"><span class="ico">▤</span>Programación anual<span class="badge" id="badge-anual">0</span></button>
      <button class="nav-item" data-nav="situaciones"><span class="ico">◈</span>Situaciones de aprendizaje<span class="badge" id="badge-sit">0</span></button>
    </div>

    <div class="nav-group">
      <div class="nav-label">Documentos</div>
      <button class="nav-item" data-nav="didactica"><span class="ico">▣</span>Programación didáctica</button>
      <button class="nav-item" data-nav="documento"><span class="ico">▧</span>Documento final</button>
      <button class="nav-item" data-nav="catalogo"><span class="ico">▥</span>Catálogo curricular</button>
    </div>

    <div class="nav-group">
      <div class="nav-label">Sistema</div>
      <button class="nav-item" data-nav="ajustes"><span class="ico">⚙</span>Ajustes y normativa</button>
    </div>

    <div class="sidebar-foot">
      <div class="context-chip" id="context-chip">
        <strong>Sin configurar</strong>
        <span>Empieza en el panel</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb" id="crumb">Panel</div>
      <div class="topbar-actions">
        <span class="save-state" id="save-state"><span class="dot"></span>Todo guardado en este equipo</span>
        <button class="btn btn-sm" data-action="print" title="Imprime el documento final (no la interfaz)">Imprimir documento</button>
      </div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data/app-data.js"></script>
<script>
(() => {
  "use strict";

  const DATA = window.PROFE_DATA || {etapas: [], competenciasClave: [], ccaa: [], materias: {}};
  const STORAGE_KEY = "profe.state.v1";

  const TITULOS = {
    panel: "Panel",
    anual: "Programación anual",
    situaciones: "Situaciones de aprendizaje",
    didactica: "Programación didáctica",
    documento: "Documento final",
    catalogo: "Catálogo curricular",
    ajustes: "Ajustes y normativa"
  };

  // Propuestas de redacción por etapa: ahorran el folio en blanco y son editables.
  const PROPUESTAS = {
    metodologia: {
      infantil: "Partiremos del juego, la experimentación y la vida cotidiana del aula. Las propuestas se organizan en pequeños grupos con rincones de actividad, asegurando tiempos de exploración libre y de acompañamiento individual. El adulto actúa como modelo y mediador, y se da prioridad al lenguaje oral, al movimiento y a la manipulación.",
      primaria: "Aprendizaje basado en proyectos y en retos cercanos al alumnado, con trabajo cooperativo en equipos heterogéneos, rutinas de pensamiento y uso planificado de recursos digitales. Alternamos actividades de gran grupo, trabajo individual y talleres, con momentos de reflexión sobre lo aprendido y de autoevaluación.",
      eso: "Metodologías activas: aprendizaje basado en proyectos y en problemas, trabajo cooperativo con roles, y aula invertida en los contenidos de mayor carga conceptual. Se combinan explicaciones breves con prácticas, investigación guiada y producción de un producto final, incorporando el uso responsable de herramientas digitales.",
      bachillerato: "Metodología que combina la exposición rigurosa de marcos teóricos con la indagación y el trabajo autónomo del alumnado. Se emplean tareas de investigación, seminarios de discusión, resolución de problemas y prácticas de laboratorio o taller, con atención a la comunicación científica y a la preparación para la prueba de acceso a la universidad.",
      fp: "Metodología basada en retos profesionales y en la simulación de contextos reales de trabajo, con planificación por resultados de aprendizaje, prácticas en taller o aula técnica y seguimiento individualizado del progreso competencial."
    },
    diversidad: {
      infantil: "Se respetan los distintos ritmos de desarrollo con apoyos visuales, anticipación de rutinas y adaptación de tiempos y materiales. La coordinación con las familias y con el equipo de orientación permite ajustar las ayudas a las necesidades detectadas.",
      primaria: "Medidas ordinarias de refuerzo y ampliación, agrupamientos flexibles, tutoría entre iguales y adaptación de materiales y tiempos. Cuando las necesidades lo requieren, se aplican adaptaciones significativas con el asesoramiento del equipo de orientación y se coordina la respuesta con las familias.",
      eso: "Se aplican medidas de refuerzo y ampliación, desdobles y agrupamientos flexibles, además de adaptaciones no significativas del currículo (tiempos, materiales, instrumentos de evaluación). El alumnado con necesidades específicas cuenta con un plan de trabajo personalizado y con la coordinación del departamento de orientación.",
      bachillerato: "Atención a los distintos ritmos de aprendizaje mediante materiales de ampliación, tutorías individualizadas y orientación académica. Se ajustan las tareas y los instrumentos de evaluación para el alumnado con necesidades específicas, con el asesoramiento del departamento de orientación.",
      fp: "Adaptación de los puestos de trabajo, de los tiempos de ejecución y de los apoyos técnicos, con seguimiento individualizado y coordinación con el departamento de orientación y con las empresas colaboradoras."
    },
    evaluacionPractica: "La práctica docente se evalúa mediante tres indicadores: el ajuste de la programación al ritmo real del grupo, la adecuación de las situaciones de aprendizaje al nivel competencial detectado y la eficacia de las medidas de atención a la diversidad. Los datos se recogen en el diario de aula y en las actas de evaluación, y se revisan al final de cada evaluación para introducir mejoras en la siguiente.",
    actividades: "Se programan actividades complementarias vinculadas a los saberes de la materia, como visitas, talleres o participación en proyectos del centro, con carácter integrado en la programación y no como añadido aislado."
  };

  const propuesta = (clave) => {
    const valor = PROPUESTAS[clave];
    if (!valor) return "";
    if (typeof valor === "string") return valor;
    return valor[state.perfil.etapa] || valor.eso || "";
  };

  const uid = () => Math.random().toString(36).slice(2, 10);

  const statePorDefecto = () => ({
    vista: "panel",
    guardado: null,
    perfil: {
      centro: "", docente: "", cursoEscolar: "2026/2027",
      ccaa: "", etapa: "eso", curso: "", materia: "", numUnidades: 9
    },
    didactica: {
      contexto: "", justificacion: "", metodologia: "", diversidad: "",
      recursos: "", actividades: "", evaluacionPractica: "",
      competencias: [], criteriosTexto: "", saberesTexto: "",
      calificacion: [
        {nombre: "Pruebas escritas", instrumento: "Prueba objetiva", peso: 40},
        {nombre: "Actividades y tareas", instrumento: "Observación sistemática", peso: 30},
        {nombre: "Proyecto / producto", instrumento: "Rúbrica", peso: 30}
      ]
    },
    anual: [],
    situaciones: [],
    catalogo: {etapa: "eso", id: "", ccaa: ""},
    situacionAbierta: null,
    unidadAbierta: null
  });

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return statePorDefecto();
      const parsed = JSON.parse(raw);
      return Object.assign(statePorDefecto(), parsed, {
        perfil: Object.assign(statePorDefecto().perfil, parsed.perfil || {}),
        didactica: Object.assign(statePorDefecto().didactica, parsed.didactica || {})
      });
    } catch (err) {
      console.warn("No se pudo leer el estado guardado:", err);
      return statePorDefecto();
    }
  }

  let saveTimer = null;
  function save() {
    state.guardado = new Date().toISOString();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      toast("No se pudo guardar: el almacenamiento local está lleno o bloqueado.");
      return;
    }
    const node = document.getElementById("save-state");
    if (node) {
      node.classList.add("pending");
      node.lastChild.textContent = "Guardando…";
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (!node) return;
      node.classList.remove("pending");
      node.lastChild.textContent = "Todo guardado en este equipo";
    }, 700);
  }

  function toast(message) {
    const node = document.getElementById("toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => node.classList.remove("show"), 2600);
  }

  const esc = (value) => String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  // ---------- Acceso a datos curriculares ----------
  const etapaInfo = (id) => DATA.etapas.find((e) => e.id === id);
  const materiasDe = (etapa) => DATA.materias[etapa] || [];
  const materiaDe = (etapa, id) => materiasDe(etapa).find((m) => m.id === id);
  const ccaaDe = (id) => DATA.ccaa.find((c) => c.id === id);

  // Modelo normalizado de una ficha: competencias específicas de la etapa y, por
  // nivel (ciclo o curso), los criterios de evaluación y los saberes básicos.
  function modeloFicha(materia) {
    const out = {
      fuente: null, remiteA: null, remisionTexto: null,
      competencias: [], criterios: {}, saberes: [], ciclos: {}, niveles: []
    };
    if (!materia) return out;
    out.fuente = materia.fuente || null;
    out.remiteA = materia.remiteA || null;
    out.remisionTexto = materia.remisionTexto || null;

    out.competencias = (Array.isArray(materia.competenciasEspecificas) ? materia.competenciasEspecificas : [])
      .filter((ce) => ce && ce.texto)
      .map((ce) => ({
        id: ce.id || "ce",
        texto: ce.texto,
        descriptores: ce.descriptores || "",
        explicacion: Array.isArray(ce.explicacion) ? ce.explicacion : []
      }));

    Object.entries(materia.ciclos || {}).forEach(([clave, nivel]) => {
      if (!nivel || typeof nivel !== "object") return;
      const criterios = {};
      Object.entries(nivel.criterios_evaluacion_por_competencia || {}).forEach(([ceId, lista]) => {
        if (Array.isArray(lista) && lista.length) criterios[ceId] = lista.slice();
      });
      const saberes = Array.isArray(nivel.saberes_basicos) ? nivel.saberes_basicos.slice() : [];
      out.ciclos[clave] = {
        etiqueta: nivel.etiqueta || clave,
        competencias: out.competencias,
        criterios,
        saberes
      };
      out.niveles.push({clave, etiqueta: nivel.etiqueta || clave});
      Object.entries(criterios).forEach(([ceId, lista]) => {
        out.criterios[ceId] = Array.from(new Set([...(out.criterios[ceId] || []), ...lista]));
      });
      saberes.forEach((s) => { if (!out.saberes.includes(s)) out.saberes.push(s); });
    });
    return out;
  }

  const modeloActual = () => modeloFicha(materiaDe(state.perfil.etapa, state.perfil.materia));

  // Elige el nivel de la ficha que corresponde al curso elegido:
  // 4º ESO -> "4-eso", 2º ESO -> "1-2-eso", 1er ciclo -> "1er-ciclo".
  function cicloDeFicha(modelo, curso) {
    const claves = Object.keys(modelo.ciclos || {});
    if (!claves.length) return null;
    const numeros = String(curso || "").match(/\d+/g);
    const n = numeros && numeros.length ? Number(numeros[0]) : null;
    if (n !== null) {
      const exacto = claves.find((k) => k === `${n}-eso` || k === `${n}-bach` || k === `${n}-curso`);
      if (exacto) return exacto;
      const rango = claves.find((k) => {
        const cifras = (k.match(/\d+/g) || []).map(Number);
        return cifras.length >= 2 && n >= cifras[0] && n <= cifras[1];
      });
      if (rango) return rango;
      const porDigito = claves.find((k) => (k.match(/\d+/) || [])[0] === String(n));
      if (porDigito) return porDigito;
    }
    return claves.length === 1 ? claves[0] : null;
  }

  // Modelo acotado al curso seleccionado; si no hay coincidencia, el conjunto completo.
  function modeloParaCurso() {
    const modelo = modeloActual();
    const clave = cicloDeFicha(modelo, state.perfil.curso);
    if (clave && modelo.ciclos[clave]) {
      return Object.assign({}, modelo.ciclos[clave], {ciclos: modelo.ciclos, ciclo: clave});
    }
    return Object.assign({}, modelo, {ciclo: null});
  }

  // ---------- Utilidades de estado ----------
  function getPath(path) {
    return path.split(".").reduce((acc, key) => (acc == null ? undefined : acc[key]), state);
  }
  function setPath(path, value) {
    const keys = path.split(".");
    let node = state;
    for (let i = 0; i < keys.length - 1; i += 1) {
      const key = keys[i];
      if (node[key] == null) node[key] = /^\d+$/.test(keys[i + 1]) ? [] : {};
      node = node[key];
    }
    node[keys[keys.length - 1]] = value;
  }

  function totalPesos() {
    return state.didactica.calificacion.reduce((sum, c) => sum + (Number(c.peso) || 0), 0);
  }

  function perfilCompleto() {
    const p = state.perfil;
    return Boolean(p.etapa && p.curso && p.materia && p.ccaa);
  }

  const trimestreDe = (index, total) => {
    const corte = Math.ceil(total / 3);
    if (index < corte) return "1.ª evaluación";
    if (index < corte * 2) return "2.ª evaluación";
    return "3.ª evaluación";
  };

  // Reparte las competencias específicas del curso entre las unidades y rellena,
  // con el texto literal de la ficha, los criterios y el bloque de saberes.
  function generarAnual() {
    const total = Math.max(1, Number(state.perfil.numUnidades) || 9);
    const modelo = modeloParaCurso();
    const competencias = modelo.competencias || [];
    const criterios = modelo.criterios || {};
    const bloques = (modelo.saberes || []).filter((s) => /^[A-Z]\.\s/.test(s));
    const sesionesPorUnidad = Math.max(1, Math.round(32 / total));
    const pesoBase = Math.round((100 / total) * 10) / 10;

    state.anual = Array.from({length: total}, (_, i) => {
      const ids = [];
      if (competencias.length) {
        ids.push(competencias[i % competencias.length].id);
        if (total >= competencias.length * 2) {
          const siguiente = competencias[(i + 1) % competencias.length].id;
          if (!ids.includes(siguiente)) ids.push(siguiente);
        }
      }
      const textos = ids.flatMap((id) => (criterios[id] || []).slice(0, 2));
      return {
        id: uid(),
        titulo: "",
        trimestre: trimestreDe(i, total),
        competencias: ids.map((id) => id.toUpperCase()).join(", "),
        criterios: textos.join("; "),
        saberes: bloques.length ? bloques[i % bloques.length] : "",
        instrumentos: "",
        sesiones: sesionesPorUnidad,
        peso: pesoBase
      };
    });
    // El redondeo deja décimas sueltas: se ajustan en la última unidad.
    if (state.anual.length) {
      state.anual[state.anual.length - 1].peso =
        Math.round((100 - pesoBase * (total - 1)) * 10) / 10;
    }
    save();
  }

  // Rellena el expediente con el texto literal de la ficha y las propuestas por
  // etapa. No toca lo que el docente ya haya escrito.
  function generarBorrador() {
    const modelo = modeloParaCurso();
    const d = state.didactica;
    const etapa = etapaInfo(state.perfil.etapa);
    const ccaa = ccaaDe(state.perfil.ccaa);
    const autonoma = ccaa && ccaa.etapas ? ccaa.etapas[state.perfil.etapa] : null;

    if (!d.competencias.length) {
      d.competencias = modelo.competencias.map((ce) => ce.id);
    }
    if (!String(d.criteriosTexto || "").trim()) {
      d.criteriosTexto = Object.entries(modelo.criterios)
        .map(([id, lista]) => `${id.toUpperCase()}: ${lista.join("; ")}`).join("\n");
    }
    if (!String(d.saberesTexto || "").trim()) {
      d.saberesTexto = modelo.saberes.map((s) => `- ${s}`).join("\n");
    }
    ["metodologia", "diversidad", "actividades", "evaluacionPractica"].forEach((campo) => {
      if (!String(d[campo] || "").trim()) d[campo] = propuesta(campo);
    });
    if (!String(d.justificacion || "").trim()) {
      const materia = materiaDe(state.perfil.etapa, state.perfil.materia);
      d.justificacion = [
        `Esta programación desarrolla el currículo de ${materia ? materia.nombre : "la materia"} ` +
        `para ${state.perfil.curso} de ${etapa ? etapa.nombre : "la etapa"}, de acuerdo con ` +
        `${(materia && materia.decreto) || (etapa && etapa.decreto) || "la normativa vigente"}.`,
        autonoma ? `En ${ccaa.nombre} se aplica ${autonoma.decreto_referencia}.` : "",
        "El currículo se organiza en competencias específicas, criterios de evaluación y saberes " +
        "básicos, y se concreta en las situaciones de aprendizaje de esta programación.",
        "Las competencias clave del perfil de salida se trabajan de forma integrada a través de " +
        "las tareas y productos que se describen en los apartados siguientes."
      ].filter(Boolean).join(" ");
    }
    if (!state.anual.length) generarAnual();
    save();
    toast("Borrador generado con el texto literal de la ficha. Revísalo y ajústalo a tu grupo.");
  }

  function nuevaSituacion() {
    const sit = {
      id: uid(), titulo: "", curso: state.perfil.curso, materia: state.perfil.materia,
      reto: "", producto: "", competenciasClave: [], competenciasEsp: "", criterios: "",
      saberes: "", agrupamientos: "", recursos: "", tiempo: "",
      fases: {motivacion: "", desarrollo: "", aplicacion: "", evaluacion: ""},
      evaluacion: "", diversidad: ""
    };
    state.situaciones.push(sit);
    state.situacionAbierta = sit.id;
    save();
  }

  // ---------- Render ----------
  const view = () => document.getElementById("view");

  function focusTitulo() {
    const titulo = view().querySelector("h1");
    if (!titulo) return;
    titulo.setAttribute("tabindex", "-1");
    titulo.focus({preventScroll: true});
  }

  function render() {
    document.querySelectorAll("[data-nav]").forEach((btn) => {
      if (btn.dataset.nav === state.vista) btn.setAttribute("aria-current", "page");
      else btn.removeAttribute("aria-current");
    });
    document.getElementById("crumb").innerHTML = `Profe <span aria-hidden="true">/</span> <strong>${esc(TITULOS[state.vista] || "")}</strong>`;
    document.getElementById("badge-anual").textContent = state.anual.length;
    document.getElementById("badge-sit").textContent = state.situaciones.length;
    renderContexto();

    const vistas = {panel: vistaPanel, anual: vistaAnual, situaciones: vistaSituaciones,
                    didactica: vistaDidactica, documento: vistaDocumento,
                    catalogo: vistaCatalogo, ajustes: vistaAjustes};
    view().innerHTML = (vistas[state.vista] || vistaPanel)();
    if (state.vista === "documento") {
      const marco = document.getElementById("doc-preview");
      if (marco) marco.srcdoc = documentoImprimible();
    }
    window.scrollTo({top: 0, behavior: "instant" in window ? "instant" : "auto"});
  }

  function renderContexto() {
    const p = state.perfil;
    const etapa = etapaInfo(p.etapa);
    const materia = materiaDe(p.etapa, p.materia);
    const ccaa = ccaaDe(p.ccaa);
    const chip = document.getElementById("context-chip");
    if (!p.materia) {
      chip.innerHTML = `<strong>${esc(etapa ? etapa.nombre : "Sin etapa")}</strong><span>Elige materia y comunidad</span>`;
      return;
    }
    chip.innerHTML = `<strong>${esc(materia ? materia.nombre : "")}</strong>
      <span>${esc(p.curso)}${ccaa ? " · " + esc(ccaa.nombre) : ""}</span>`;
  }

  // --- Panel ---
  // Requisitos que suele revisar la inspección educativa al pedir el expediente.
  function requisitos() {
    const p = state.perfil;
    const d = state.didactica;
    const modelo = modeloParaCurso();
    const pesos = state.anual.reduce((s, u) => s + (Number(u.peso) || 0), 0);
    return [
      {ok: Boolean(p.centro && p.docente), t: "Datos del centro y del docente", s: "Cabecera de todos los documentos.", vista: "ajustes"},
      {ok: Boolean(p.etapa && p.curso && p.materia && p.ccaa), t: "Contexto curricular", s: "Etapa, curso, materia y comunidad autónoma.", vista: "panel"},
      {ok: d.contexto.trim().length > 40, t: "Contextualización del grupo", s: "Entorno, características del alumnado y necesidades detectadas.", vista: "didactica"},
      {ok: d.competencias.length > 0, t: "Competencias específicas", s: "Seleccionadas del currículo de la materia.", vista: "didactica"},
      {ok: Boolean(d.criteriosTexto.trim() && d.saberesTexto.trim()), t: "Criterios de evaluación y saberes básicos", s: "Elementos curriculares que se trabajan.", vista: "didactica"},
      {ok: d.calificacion.length > 0 && totalPesos() === 100, t: "Criterios de calificación al 100 %", s: "Instrumentos y peso de cada uno.", vista: "didactica"},
      {ok: Boolean(d.metodologia.trim()), t: "Metodología", s: "Principios y estrategias didácticas.", vista: "didactica"},
      {ok: Boolean(d.diversidad.trim()), t: "Atención a la diversidad", s: "Medidas ordinarias y específicas.", vista: "didactica"},
      {ok: state.anual.length > 0 && pesos === 100, t: "Programación anual completa", s: "Unidades repartidas y pesos que suman 100 %.", vista: "anual"},
      {ok: state.situaciones.some((s) => s.titulo.trim() && s.producto.trim()), t: "Situación de aprendizaje evaluable", s: "Con título y producto final definidos.", vista: "situaciones"},
      {ok: Boolean(d.evaluacionPractica.trim()), t: "Evaluación de la práctica docente", s: "Indicadores de mejora para el curso.", vista: "didactica"},
      {ok: Boolean(modelo.competencias.length), t: "Ficha curricular disponible", s: "Competencias y saberes cargados desde el catálogo.", vista: "catalogo"}
    ];
  }

  function vistaPanel() {

                <label for="p-curso">Curso o ciclo</label>
                <select id="p-curso" data-change="perfil.curso">
                  <option value="">Selecciona…</option>
                  ${(etapa ? etapa.ciclos : []).map((c) => `<option value="${esc(c)}" ${c === p.curso ? "selected" : ""}>${esc(c)}</option>`).join("")}
                </select>

            </div>

              <div class="field">

                  <option value="">Selecciona…</option>
                  ${DATA.ccaa.map((c) => `<option value="${esc(c.id)}" ${c.id === p.ccaa ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}
                </select>

            </div>
            ${materia ? `
              <div class="card-pad" style="background:var(--surface-2);border-radius:10px;border:1px solid var(--line)">

                  <div>
                    <strong style="font-size:13.5px">${esc(materia.nombre)}</strong>

            <details ${(!p.centro || !p.docente) ? "open" : ""}>
              <summary class="small" style="cursor:pointer;color:var(--ink-2);font-weight:600">Datos de cabecera del documento</summary>

          </div>
          <div class="card-body">
            <div class="req-list">
              ${pasos.map((paso) => `
                <div class="req">
                  <div class="mark ${paso.ok ? "ok" : "ko"}">${paso.ok ? "✓" : "!"}</div>
                  <div class="txt"><strong>${esc(paso.t)}</strong><span>${esc(paso.s)}</span></div>
                  ${paso.ok ? "" : `<button class="btn btn-ghost btn-sm" data-action="ir-vista" data-vista="${paso.vista}">Completar</button>`}
                </div>`).join("")}
            </div>
            <div class="row" style="margin-top:14px;flex-wrap:wrap">
              <button class="btn btn-primary btn-sm" data-action="borrador">Generar borrador completo</button>
              <button class="btn btn-sm" data-action="ir-vista" data-vista="documento">Ver documento final</button>
              <span class="small muted">${hechos} de ${pasos.length} requisitos listos</span>
            </div>
          </div>
        </div>
      </div>

      <div class="grid-3" style="margin-top:18px">
        <button class="tool-card" data-action="ir-anual">
          <div class="tool-ico">▤</div>
          <div>
            <h3>Programación anual</h3>
            <p>Secuencia las unidades por evaluación con competencias, criterios y peso en la calificación.</p>
            <div class="meta"><span class="pill pill-mute">${state.anual.length} unidades</span></div>
          </div>
        </button>
        <button class="tool-card" data-action="ir-didactica">
          <div class="tool-ico">▣</div>
          <div>
            <h3>Programación didáctica</h3>
            <p>Contextualización, metodología, atención a la diversidad y criterios de calificación.</p>
            <div class="meta"><span class="pill ${pesos === 100 ? "pill-ok" : "pill-warn"}">Calificación ${pesos}%</span></div>
          </div>
        </button>
        <button class="tool-card" data-action="ir-situaciones">
          <div class="tool-ico">◈</div>
          <div>
            <h3>Situaciones de aprendizaje</h3>
            <p>Retos competenciales con producto final, secuencia de fases e instrumentos de evaluación.</p>
            <div class="meta"><span class="pill pill-mute">${state.situaciones.length} situaciones</span></div>
          </div>
        </button>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-head">
          <h2>Documento final</h2>
          <span class="grow"></span>
          <span class="pill ${porcentaje === 100 ? "pill-ok" : "pill-warn"}">${porcentaje === 100 ? "Listo para entregar" : "Faltan " + (pasos.length - hechos) + " apartados"}</span>
        </div>
        <div class="card-body row" style="justify-content:space-between">
          <p class="small" style="color:var(--ink-2);max-width:60ch">Convierte todo lo anterior en un documento numerado, con portada, tablas y anexos, listo para imprimir o guardar en PDF.</p>
          <div class="row">
            <button class="btn" data-action="ir-vista" data-vista="documento">Abrir documento</button>
            <button class="btn btn-primary" data-action="export-html">Imprimir o guardar PDF</button>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:18px">
        <div class="card-head">
          <h2>Marco normativo aplicable</h2>
          <span class="grow"></span>
          ${etapa ? `<span class="pill pill-brand">${esc(etapa.nombre)}</span>` : ""}
        </div>
        <div class="card-body">
          <p class="small" style="color:var(--ink-2)">${esc(DATA.fuente || "")}</p>
          <div class="divider" style="margin:14px 0"></div>
          <div class="grid-2">
            <div>
              <div class="small muted" style="margin-bottom:4px">Referencia estatal de la etapa</div>
              <p class="small">${esc((etapa && etapa.decreto) || "Selecciona una etapa para ver su referencia normativa.")}</p>
            </div>
            <div>
              <div class="small muted" style="margin-bottom:4px">Desarrollo autonómico</div>
              ${ccaa && ccaa.etapas && ccaa.etapas[p.etapa] ? `
                <p class="small">${esc(ccaa.etapas[p.etapa].decreto_referencia)}</p>
                <div class="row" style="gap:8px;margin-top:6px;flex-wrap:wrap">
                  <span class="pill ${ccaa.etapas[p.etapa].estado === "verificado" ? "pill-ok" : "pill-warn"}">${ccaa.etapas[p.etapa].estado === "verificado" ? "Norma comprobada" : "Confirma la norma"}</span>
                  ${ccaa.etapas[p.etapa].boletin ? `<span class="small muted">${esc(ccaa.etapas[p.etapa].boletin)}</span>` : ""}
                </div>
                ${ccaa.etapas[p.etapa].observaciones ? `<p class="small muted" style="margin-top:6px">${esc(ccaa.etapas[p.etapa].observaciones)}</p>` : ""}` : `<p class="small">${ccaa ? "Sin ficha autonómica detallada para esta etapa." : "Selecciona tu comunidad autónoma."}</p>`}
            </div>
          </div>
          ${etapa && etapa.notas && etapa.notas.length ? `
            <div class="divider" style="margin:14px 0"></div>
            <ul class="list-num">${etapa.notas.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
        </div>
      </div>`;
  }

  // --- Programación anual ---
  function vistaAnual() {
    const p = state.perfil;
    if (!p.materia) return avisoConfigurar("programación anual");
    const modelo = modeloActual();
    const pesos = state.anual.reduce((s, u) => s + (Number(u.peso) || 0), 0);
    const sesiones = state.anual.reduce((s, u) => s + (Number(u.sesiones) || 0), 0);

    // Cobertura del currículo: qué competencias específicas toca cada unidad.
    const cubiertas = new Set();
    state.anual.forEach((u) => String(u.competencias || "")
      .split(/[,;]+/).map((x) => x.trim().toLowerCase()).filter(Boolean)
      .forEach((x) => cubiertas.add(x)));
    const totalCE = modelo.competencias.length;
    const sinCubrir = modelo.competencias.filter((ce) => !cubiertas.has(ce.id.toLowerCase()));
    const cobertura = totalCE ? Math.round(((totalCE - sinCubrir.length) / totalCE) * 100) : 0;

    const cuerpo = state.anual.length ? `
      ${totalCE ? `
        <div class="card" style="margin-bottom:14px">
          <div class="card-body row" style="justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:8px">
            <div class="row" style="gap:8px;flex-wrap:wrap">
              <span class="pill ${sinCubrir.length ? "pill-warn" : "pill-ok"}">CE trabajadas: ${totalCE - sinCubrir.length}/${totalCE}</span>
              <span class="small muted">${cobertura} % del currículo del curso</span>
            </div>
            ${sinCubrir.length ? `<button class="btn btn-sm" data-action="cubrir-ce">Repartir las CE que faltan</button>` : ""}
          </div>
          ${sinCubrir.length ? `<p class="small muted" style="padding:0 16px 12px">Sin trabajar: ${sinCubrir.map((ce) => esc(ce.id.toUpperCase())).join(", ")}</p>` : ""}
        </div>` : ""}
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-num">Nº</th>
              <th style="min-width:220px">Unidad / situación</th>
              <th style="min-width:150px">Evaluación</th>
              <th style="min-width:150px">Competencias específicas</th>
              <th style="min-width:200px">Criterios de evaluación</th>
              <th style="min-width:160px">Instrumentos</th>
              <th style="width:82px">Sesiones</th>
              <th style="width:86px">Peso %</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody>
            ${state.anual.map((u, i) => `
              <tr>
                <td class="col-num">${i + 1}</td>
                <td><input type="text" placeholder="Título de la unidad" value="${esc(u.titulo)}" data-bind="anual.${i}.titulo"></td>
                <td>
                  <select data-bind="anual.${i}.trimestre">
                    ${["1.ª evaluación", "2.ª evaluación", "3.ª evaluación"].map((t) =>
                      `<option ${t === u.trimestre ? "selected" : ""}>${t}</option>`).join("")}
                  </select>
                </td>
                <td><input type="text" placeholder="CE1, CE2…" value="${esc(u.competencias)}" data-bind="anual.${i}.competencias"></td>
                <td><textarea placeholder="Criterios trabajados" data-bind="anual.${i}.criterios">${esc(u.criterios)}</textarea></td>
                <td><input type="text" placeholder="Rúbrica, prueba…" value="${esc(u.instrumentos)}" data-bind="anual.${i}.instrumentos"></td>
                <td><input type="number" min="0" max="80" value="${esc(u.sesiones == null ? "" : u.sesiones)}" data-bind="anual.${i}.sesiones"></td>
                <td><input type="number" min="0" max="100" step="0.5" value="${esc(u.peso)}" data-bind="anual.${i}.peso"></td>
                <td class="col-actions">
                  <button class="btn btn-ghost btn-sm" data-action="toggle-unidad" data-id="${u.id}" title="Desarrollar la unidad" aria-expanded="${state.unidadAbierta === u.id}">${state.unidadAbierta === u.id ? "▴" : "▾"}</button>
                  <button class="btn btn-ghost btn-sm" data-action="dup-anual" data-i="${i}" title="Duplicar">⧉</button>
                  <button class="btn btn-ghost btn-sm" data-action="del-anual" data-i="${i}" title="Eliminar">✕</button>
                </td>
              </tr>
              ${state.unidadAbierta === u.id ? `
              <tr>
                <td colspan="9" style="background:var(--bg-2, #f8fafc)">
                  <div class="stack" style="padding:6px 2px">
                    <div class="grid-2">
                      <div class="field">
                        <label>Objetivos de la unidad</label>
                        <textarea placeholder="Qué debe lograr el alumnado al terminar la unidad" data-bind="anual.${i}.desarrollo.objetivos">${esc((u.desarrollo || {}).objetivos || "")}</textarea>
                      </div>
                      <div class="field">
                        <label>Evaluación de la unidad</label>
                        <textarea placeholder="Instrumentos, momentos y criterios de calificación" data-bind="anual.${i}.desarrollo.evaluacion">${esc((u.desarrollo || {}).evaluacion || "")}</textarea>
                      </div>
                    </div>
                    <div class="field">
                      <label>Actividades por sesión</label>
                      <textarea style="min-height:120px" placeholder="Sesión 1: … · Sesión 2: … · Sesión 3: …" data-bind="anual.${i}.desarrollo.actividades">${esc((u.desarrollo || {}).actividades || "")}</textarea>
                      <span class="help">${esc(u.sesiones || 0)} sesiones previstas en esta unidad.</span>
                    </div>
                    <div class="field">
                      <label>Atención a la diversidad en esta unidad</label>
                      <textarea placeholder="Apoyos, ampliaciones y ajustes concretos" data-bind="anual.${i}.desarrollo.diversidad">${esc((u.desarrollo || {}).diversidad || "")}</textarea>
                    </div>
                  </div>
                </td>
              </tr>` : ""}`).join("")}
          </tbody>
        </table>
      </div>
      <div class="row" style="margin-top:12px;justify-content:space-between">
        <span class="small ${pesos === 100 ? "muted" : ""}">
          ${pesos === 100
            ? "Los pesos suman 100 %."
            : `<span class="pill pill-warn">Los pesos suman ${pesos} %</span> <span class="muted">Ajusta hasta 100 % para que la calificación sea coherente.</span>`}
          <span class="muted"> · ${sesiones} sesiones programadas</span>
        </span>
        <div class="row">
          <button class="btn btn-sm" data-action="repartir-pesos">Repartir 100 %</button>
          <button class="btn btn-sm" data-action="add-anual">Añadir unidad</button>
          <button class="btn btn-sm" data-action="regen-anual">Regenerar desde el número de unidades</button>
        </div>
      </div>` : `
      <div class="empty">
        <h3>Aún no hay unidades</h3>
        <p>Genera una estructura de ${esc(p.numUnidades)} unidades repartidas en tres evaluaciones y ajústala después.</p>
        <button class="btn btn-primary" data-action="regen-anual">Generar ${esc(p.numUnidades)} unidades</button>
      </div>`;

    return `
      <div class="view-head">
        <h1>Programación anual</h1>
        <p>Secuencia temporal del curso. Cada fila es una unidad didáctica o situación de aprendizaje con su peso en la calificación.</p>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>${esc(materiaDe(p.etapa, p.materia).nombre)} · ${esc(p.curso)}</h2>
          <span class="hint">${esc(ccaaDe(p.ccaa) ? ccaaDe(p.ccaa).nombre : "")}</span>
          <span class="grow"></span>
          <span class="pill pill-mute">${state.anual.length} unidades</span>
        </div>
        <div class="card-body">${cuerpo}</div>
      </div>
      ${modelo.competencias.length ? `
        <div class="card" style="margin-top:16px">
          <div class="card-head"><h2>Competencias específicas de la materia</h2><span class="grow"></span><span class="hint">Referencia para rellenar la tabla</span></div>
          <div class="card-body">
            <ul class="list-num">
              ${modelo.competencias.map((ce) => `<li><strong>${esc(ce.id.toUpperCase())}.</strong> ${esc(ce.texto)}</li>`).join("")}
            </ul>
          </div>
        </div>` : ""}`;
  }

  // --- Situaciones ---
  function vistaSituaciones() {
    const p = state.perfil;
    if (!p.materia) return avisoConfigurar("situaciones de aprendizaje");
    const modelo = modeloActual();

    const lista = state.situaciones.length ? state.situaciones.map((s) => {
      const abierta = s.id === state.situacionAbierta;
      return `
        <div class="sit">
          <div class="body">
            <strong>${esc(s.titulo || "Situación sin título")}</strong>
            <span>${esc(s.producto ? "Producto: " + s.producto : "Sin producto final definido")}${s.competenciasClave.length ? " · " + s.competenciasClave.length + " competencias clave" : ""}</span>
          </div>
          <button class="btn btn-sm" data-action="toggle-sit" data-id="${s.id}">${abierta ? "Cerrar" : "Editar"}</button>
          <button class="btn btn-ghost btn-sm" data-action="dup-sit" data-id="${s.id}" title="Duplicar">⧉</button>
          <button class="btn btn-ghost btn-sm" data-action="del-sit" data-id="${s.id}" title="Eliminar">✕</button>
        </div>
        ${abierta ? `<div class="sit-edit">${editorSituacion(s, modelo)}</div>` : ""}`;
    }).join("") : `
      <div class="empty">
        <h3>Diseña tu primera situación de aprendizaje</h3>
        <p>Una situación parte de un reto cercano al alumnado y termina en un producto evaluable con criterios del currículo.</p>
        <button class="btn btn-primary" data-action="new-sit">Crear situación de aprendizaje</button>
      </div>`;

    return `
      <div class="view-head">
        <h1>Situaciones de aprendizaje</h1>
        <p>Retos competenciales contextualizados. Cada situación conecta competencias clave, competencias específicas y criterios de evaluación.</p>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>${esc(materiaDe(p.etapa, p.materia).nombre)} · ${esc(p.curso)}</h2>
          <span class="grow"></span>
          <button class="btn btn-primary btn-sm" data-action="new-sit">Nueva situación</button>
        </div>
        ${lista}
      </div>`;
  }

  function editorSituacion(s, modelo) {
    const idx = state.situaciones.findIndex((x) => x.id === s.id);
    const base = `situaciones.${idx}`;
    return `
      <div class="stack" style="padding-top:16px;border-top:1px solid var(--line)">
        <div class="grid-2">
          <div class="field">
            <label>Título de la situación</label>
            <input type="text" placeholder="Ej.: ¿Quién decide lo que comemos?" value="${esc(s.titulo)}" data-bind="${base}.titulo">
          </div>
          <div class="field">
            <label>Producto final o actuación evaluable</label>
            <input type="text" placeholder="Ej.: campaña de etiquetado saludable" value="${esc(s.producto)}" data-bind="${base}.producto">
          </div>
        </div>
        <div class="field">
          <label>Reto o pregunta que organiza la situación</label>
          <textarea placeholder="Describe el reto competencial y el contexto del alumnado" data-bind="${base}.reto">${esc(s.reto)}</textarea>
        </div>

        <div class="field">
          <label>Competencias clave movilizadas</label>
          <div class="grid-3" style="gap:8px">
            ${DATA.competenciasClave.map((cc) => `
              <label class="check">
                <input type="checkbox" data-check="${base}.competenciasClave" value="${esc(cc.id)}" ${s.competenciasClave.includes(cc.id) ? "checked" : ""}>
                <span><strong>${esc(cc.etiqueta)}</strong><small>${esc(cc.nombre)}</small></span>
              </label>`).join("")}
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <div class="row" style="justify-content:space-between">
              <label>Competencias específicas trabajadas</label>
              ${modelo.competencias.length ? `<button class="btn btn-ghost btn-sm" data-action="sit-cargar" data-base="${base}">Cargar del curso</button>` : ""}
            </div>
            <textarea placeholder="${modelo.competencias.length ? modelo.competencias.slice(0, 2).map((c) => c.id.toUpperCase()).join(", ") : "CE1, CE2…"}" data-bind="${base}.competenciasEsp">${esc(s.competenciasEsp)}</textarea>
            ${modelo.competencias.length ? `<span class="help">Disponibles: ${modelo.competencias.map((c) => c.id.toUpperCase()).join(" · ")}</span>` : ""}
          </div>
          <div class="field">
            <label>Criterios de evaluación</label>
            <textarea placeholder="Criterios que se evalúan con el producto final" data-bind="${base}.criterios">${esc(s.criterios)}</textarea>
          </div>
        </div>

        <div class="field">
          <label>Saberes básicos implicados</label>
          <textarea placeholder="Bloques y saberes del currículo" data-bind="${base}.saberes">${esc(s.saberes)}</textarea>
        </div>

        <div>
          <div class="row" style="justify-content:space-between;margin-bottom:10px">
            <h3 style="font-size:14px">Secuencia de trabajo</h3>
            <div class="row">
              <button class="btn btn-ghost btn-sm" data-action="sit-a-anual" data-id="${s.id}">Añadir a la programación anual</button>
              <button class="btn btn-ghost btn-sm" data-action="sugerir-secuencia" data-i="${idx}">Insertar secuencia sugerida</button>
            </div>
          </div>
          <div class="grid-2">
            <div class="fase field">
              <label>1. Motivación y activación</label>
              <textarea data-bind="${base}.fases.motivacion">${esc(s.fases.motivacion)}</textarea>
            </div>
            <div class="fase field">
              <label>2. Desarrollo y exploración</label>
              <textarea data-bind="${base}.fases.desarrollo">${esc(s.fases.desarrollo)}</textarea>
            </div>
            <div class="fase field">
              <label>3. Aplicación y producto</label>
              <textarea data-bind="${base}.fases.aplicacion">${esc(s.fases.aplicacion)}</textarea>
            </div>
            <div class="fase field">
              <label>4. Evaluación y reflexión</label>
              <textarea data-bind="${base}.fases.evaluacion">${esc(s.fases.evaluacion)}</textarea>
            </div>
          </div>
        </div>

        <div class="grid-3">
          <div class="field"><label>Agrupamientos</label><input type="text" placeholder="Parejas, equipos de 4…" value="${esc(s.agrupamientos)}" data-bind="${base}.agrupamientos"></div>
          <div class="field"><label>Recursos</label><input type="text" placeholder="Materiales, espacios, TIC…" value="${esc(s.recursos)}" data-bind="${base}.recursos"></div>
          <div class="field"><label>Temporalización</label><input type="text" placeholder="6 sesiones" value="${esc(s.tiempo)}" data-bind="${base}.tiempo"></div>
        </div>

        <div class="grid-2">
          <div class="field"><label>Instrumentos de evaluación</label><textarea data-bind="${base}.evaluacion">${esc(s.evaluacion)}</textarea></div>
          <div class="field"><label>Atención a la diversidad</label><textarea data-bind="${base}.diversidad">${esc(s.diversidad)}</textarea></div>
        </div>
      </div>`;
  }

  // --- Programación didáctica ---
  function vistaDidactica() {
    const p = state.perfil;
    if (!p.materia) return avisoConfigurar("programación didáctica");
    const d = state.didactica;
    const modelo = modeloActual();
    const etapa = etapaInfo(p.etapa);
    const ccaa = ccaaDe(p.ccaa);
    const pesos = totalPesos();

    return `
      <div class="view-head">
        <h1>Programación didáctica</h1>
        <p>Documento completo de la materia: contextualización, elementos curriculares, metodología y evaluación.</p>
      </div>

      <div class="card">
        <div class="card-head"><h2>1. Datos de identificación</h2></div>
        <div class="card-body grid-2">
          <div class="field"><label>Centro educativo</label><input type="text" placeholder="Nombre del centro" value="${esc(p.centro)}" data-bind="perfil.centro"></div>
          <div class="field"><label>Docente responsable</label><input type="text" placeholder="Nombre y apellidos" value="${esc(p.docente)}" data-bind="perfil.docente"></div>
          <div class="field"><label>Curso escolar</label><input type="text" value="${esc(p.cursoEscolar)}" data-bind="perfil.cursoEscolar"></div>
          <div class="field"><label>Materia / ámbito</label><input type="text" value="${esc(materiaDe(p.etapa, p.materia).nombre)}" disabled></div>
          <div class="field"><label>Curso</label><input type="text" value="${esc(p.curso)}" disabled></div>
          <div class="field"><label>Comunidad autónoma</label><input type="text" value="${esc(ccaa ? ccaa.nombre : "")}" disabled></div>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-head"><h2>2. Justificación normativa</h2><span class="grow"></span><span class="hint">Se completa desde el catálogo</span></div>
        <div class="card-body stack">
          <div class="field">
            <label>Referencia estatal</label>
            <textarea disabled>${esc((materiaDe(p.etapa, p.materia).decreto) || (etapa ? etapa.decreto : ""))}</textarea>
          </div>
          <div class="field">
            <label>Desarrollo autonómico</label>
            <textarea disabled>${esc((ccaa && ccaa.etapas && ccaa.etapas[p.etapa] && ccaa.etapas[p.etapa].decreto_referencia) || "Sin ficha autonómica detallada. Consulta el boletín oficial de tu comunidad.")}</textarea>
            ${ccaa && ccaa.etapas && ccaa.etapas[p.etapa] ? `
              <div class="row" style="gap:8px;margin-top:6px;flex-wrap:wrap">
                <span class="pill ${ccaa.etapas[p.etapa].estado === "verificado" ? "pill-ok" : "pill-warn"}">${ccaa.etapas[p.etapa].estado === "verificado" ? "Norma comprobada" : "Confirma la norma"}</span>
                <span class="small muted">${esc(ccaa.etapas[p.etapa].boletin || "")}</span>

        <div class="card-head">

          ${modelo.competencias.length ? `
            <div class="stack">
              ${modelo.competencias.map((ce) => `
                <label class="check">

                </label>`).join("")}

      <div class="card" style="margin-top:16px">
        <div class="card-head"><h2>5. Criterios de evaluación y saberes básicos</h2></div>

              <label>Criterios de evaluación trabajados</label>

                ${Object.keys(modelo.criterios).length ? `<button class="btn btn-ghost btn-sm" data-action="cargar-criterios">Cargar de la ficha</button>` : ""}
              </span>
            </div>
            <textarea style="min-height:150px" placeholder="Selecciona o redacta los criterios de evaluación" data-bind="didactica.criteriosTexto">${esc(d.criteriosTexto || "")}</textarea>
            ${modelo.competencias.length ? `<span class="help">${Object.keys(modelo.criterios).length} bloques de criterios disponibles en la ficha.</span>` : ""}
          </div>
          <div class="field">
            <div class="row" style="justify-content:space-between">
              <label>Saberes básicos</label>
              ${modelo.saberes.length ? `<button class="btn btn-ghost btn-sm" data-action="cargar-saberes">Cargar de la ficha</button>` : ""}

            ${modelo.saberes.length ? `<span class="help">${modelo.saberes.length} saberes disponibles en la ficha.</span>` : ""}

      <div class="card" style="margin-top:16px">
        <div class="card-head"><h2>6. Metodología y atención a la diversidad</h2><span class="grow"></span><span class="hint">Puedes insertar una propuesta y adaptarla</span></div>
        <div class="card-body grid-2">
          <div class="field">
            <div class="row" style="justify-content:space-between">
              <label>Principios metodológicos</label>
              <button class="btn btn-ghost btn-sm" data-action="sugerir" data-campo="metodologia">Insertar propuesta</button>
            </div>
            <textarea style="min-height:120px" placeholder="Aprendizaje basado en proyectos, trabajo cooperativo, rutinas de pensamiento…" data-bind="didactica.metodologia">${esc(d.metodologia)}</textarea>

          <div class="field">
            <div class="row" style="justify-content:space-between">
              <label>Atención a la diversidad</label>
              <button class="btn btn-ghost btn-sm" data-action="sugerir" data-campo="diversidad">Insertar propuesta</button>
            </div>
            <textarea style="min-height:120px" placeholder="Medidas ordinarias, refuerzo, ampliación, adaptaciones" data-bind="didactica.diversidad">${esc(d.diversidad)}</textarea>
          </div>

      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-head"><h2>7. Recursos y actividades complementarias</h2></div>
        <div class="card-body grid-2">
          <div class="field">
            <label>Recursos y materiales</label>
            <textarea placeholder="Libro de texto, laboratorio, recursos digitales, espacios" data-bind="didactica.recursos">${esc(d.recursos)}</textarea>
          </div>
          <div class="field">
            <div class="row" style="justify-content:space-between">
              <label>Actividades complementarias</label>
              <button class="btn btn-ghost btn-sm" data-action="sugerir" data-campo="actividades">Insertar propuesta</button>
            </div>
            <textarea placeholder="Salidas, talleres, participación en proyectos del centro" data-bind="didactica.actividades">${esc(d.actividades)}</textarea>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-head"><h2>8. Evaluación de la práctica docente</h2><span class="grow"></span><span class="hint">Indicadores y propuestas de mejora</span></div>
        <div class="card-body">
          <div class="field">
            <div class="row" style="justify-content:space-between">
              <label>Procedimiento e indicadores</label>
              <button class="btn btn-ghost btn-sm" data-action="sugerir" data-campo="evaluacionPractica">Insertar propuesta</button>
            </div>
            <textarea style="min-height:110px" placeholder="Cómo se revisa la propia programación y qué indicadores se usan" data-bind="didactica.evaluacionPractica">${esc(d.evaluacionPractica)}</textarea>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-head">
          <h2>9. Criterios de calificación</h2>
          <span class="grow"></span>
          <span class="pill ${pesos === 100 ? "pill-ok" : "pill-warn"}">Total ${pesos} %</span>
        </div>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th style="min-width:200px">Instrumento o bloque</th><th style="min-width:180px">Tipo</th><th style="width:110px">Peso %</th><th class="col-actions"></th></tr>
              </thead>
              <tbody>
                ${d.calificacion.map((c, i) => `
                  <tr>
                    <td><input type="text" value="${esc(c.nombre)}" data-bind="didactica.calificacion.${i}.nombre"></td>
                    <td>
                      <select data-bind="didactica.calificacion.${i}.instrumento">
                        ${["Prueba objetiva", "Rúbrica", "Lista de cotejo", "Observación sistemática", "Portafolio", "Diario de aprendizaje", "Autoevaluación", "Coevaluación", "Proyecto"].map((t) =>
                          `<option ${t === c.instrumento ? "selected" : ""}>${t}</option>`).join("")}
                      </select>
                    </td>
                    <td><input type="number" min="0" max="100" value="${esc(c.peso)}" data-bind="didactica.calificacion.${i}.peso"></td>
                    <td class="col-actions"><button class="btn btn-ghost btn-sm" data-action="del-peso" data-i="${i}" title="Eliminar">✕</button></td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
          <div class="row" style="margin-top:12px">
            <button class="btn btn-sm" data-action="add-peso">Añadir criterio de calificación</button>
            <span class="small muted">La suma debe ser exactamente 100 %.</span>
          </div>
        </div>
      </div>`;
  }

  // --- Documento final ---
  function vistaDocumento() {
    const p = state.perfil;
    if (!p.materia) return avisoConfigurar("el documento final");
    const lista = requisitos();
    const pendientes = lista.filter((r) => !r.ok);
    const hechos = lista.length - pendientes.length;
    const materia = materiaDe(p.etapa, p.materia);

    return `
      <div class="view-head">
        <h1>Documento final</h1>
        <p>Vista previa real del expediente completo: portada, marco normativo, elementos curriculares, programación anual, situaciones de aprendizaje y evaluación. Es exactamente lo que se imprime.</p>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-head">
          <h2>${esc(materia.nombre)} · ${esc(p.curso)}</h2>
          <span class="grow"></span>
          <span class="pill ${pendientes.length ? "pill-warn" : "pill-ok"}">
            ${pendientes.length ? pendientes.length + " apartados pendientes" : "Documento completo"}
          </span>
          <button class="btn btn-sm" data-action="ir-didactica">Editar</button>
          <button class="btn btn-primary btn-sm" data-action="print">Imprimir / PDF</button>
        </div>
        <div class="card-body">
          ${pendientes.length ? `
            <div class="req-list" style="margin-bottom:14px">
              ${pendientes.map((r) => `
                <div class="req">
                  <div class="mark ko">!</div>
                  <div class="txt"><strong>${esc(r.t)}</strong><span>${esc(r.s)}</span></div>
                  <button class="btn btn-ghost btn-sm" data-action="ir-vista" data-vista="${r.vista}">Ir</button>
                </div>`).join("")}
            </div>` : `<p class="small muted" style="margin-bottom:12px">Todos los apartados del checklist están completos. Revisa la vista previa y descarga el PDF.</p>`}
          <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
            <span class="small muted">${hechos} de ${lista.length} apartados listos</span>
            <span class="grow"></span>
            <button class="btn btn-primary btn-sm" data-action="borrador">Generar borrador completo</button>
            <button class="btn btn-sm" data-action="export-word">Descargar Word (.doc)</button>
            <button class="btn btn-sm" data-action="export-html">Abrir en pestaña imprimible</button>
            <button class="btn btn-sm" data-action="export-json">Copia de seguridad</button>
          </div>
          <iframe id="doc-preview" class="doc-frame" title="Vista previa del documento final" sandbox="allow-same-origin"></iframe>
        </div>
      </div>`;
  }

  // --- Catálogo ---
  function vistaCatalogo() {
    const cat = state.catalogo;
    const etapa = etapaInfo(cat.etapa);
    const lista = materiasDe(cat.etapa);
    const seleccion = lista.find((m) => m.id === cat.id) || lista[0];
    const modelo = modeloFicha(seleccion);
    const ccaa = ccaaDe(cat.ccaa);

    return `
      <div class="view-head">
        <h1>Catálogo curricular</h1>
        <p>Competencias específicas, criterios de evaluación y saberes básicos por etapa y materia, con el desarrollo autonómico disponible.</p>
      </div>
      <div class="row" style="margin-bottom:14px">
        ${DATA.etapas.map((e) => `
          <button class="btn btn-sm ${e.id === cat.etapa ? "btn-primary" : ""}" data-action="cat-etapa" data-id="${esc(e.id)}">${esc(e.nombre)}</button>`).join("")}
        <span class="grow"></span>
        <select style="width:auto" data-change="catalogo.ccaa">
          <option value="">Ver comunidad autónoma…</option>
          ${DATA.ccaa.map((c) => `<option value="${esc(c.id)}" ${c.id === cat.ccaa ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}
        </select>

          <div class="card-head"><h2>${esc(ccaa.nombre)}</h2><span class="grow"></span>
            ${ccaa.enlaces ? Object.entries(ccaa.enlaces).map(([clave, url]) => `<a class="btn btn-sm" href="${esc(url)}" target="_blank" rel="noopener">${clave === "boletin" ? "Boletín oficial" : "Portal de currículo"}</a>`).join("") : ""}
          </div>
          <div class="card-body stack">
            ${ccaa.etapas && ccaa.etapas[cat.etapa] ? `
              <div>
                <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
                  <span class="small muted">Referencia para ${esc(etapa ? etapa.nombre : cat.etapa)}</span>
                  <span class="pill ${ccaa.etapas[cat.etapa].estado === "verificado" ? "pill-ok" : "pill-warn"}">${ccaa.etapas[cat.etapa].estado === "verificado" ? "Norma comprobada" : "Confirma la norma"}</span>
                  ${ccaa.etapas[cat.etapa].boletin ? `<span class="small muted">${esc(ccaa.etapas[cat.etapa].boletin)}</span>` : ""}
                </div>
                <p class="small" style="margin-top:6px">${esc(ccaa.etapas[cat.etapa].decreto_referencia || "")}</p>
                ${ccaa.etapas[cat.etapa].observaciones ? `<p class="small muted" style="margin-top:4px">${esc(ccaa.etapas[cat.etapa].observaciones)}</p>` : ""}
                ${ccaa.etapas[cat.etapa].estado !== "verificado" ? `<p class="small muted" style="margin-top:4px">${esc((ccaa.fuente && ccaa.fuente.nota) || "")} Comprueba el número y la fecha en el boletín antes de citarla.</p>` : ""}
              </div>` : `<p class="small muted">Sin ficha autonómica para esta etapa.</p>`}
            ${ccaa.notas && ccaa.notas.length ? `<ul class="list-num">${ccaa.notas.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
          </div>
        </div>` : ""}

      <div class="cat-grid">
        <div class="card">
          <div class="card-head"><h2>${esc(etapa ? etapa.nombre : "")}</h2><span class="grow"></span><span class="pill pill-mute">${lista.length}</span></div>
          <div class="cat-list">
            ${lista.length ? lista.map((m) => `
              <button class="cat-item ${seleccion && m.id === seleccion.id ? "sel" : ""}" data-action="cat-materia" data-id="${esc(m.id)}">
                <span>${esc(m.nombre)}</span>
                <span class="flag">${m.tieneFicha ? "ficha" : "pendiente"}</span>
              </button>`).join("") : `<p class="small muted" style="padding:12px">Esta etapa se organiza por módulos profesionales. Añade tus títulos desde Ajustes.</p>`}
          </div>
        </div>

        <div class="card detail">
          ${seleccion ? `
            <div class="card-head">
              <div>
                <h3>${esc(seleccion.nombre)}</h3>
                <div class="hint" style="font-size:12.5px">${esc(seleccion.decreto || (etapa ? etapa.decreto : ""))}</div>
              </div>
              <span class="grow"></span>
              <span class="pill ${seleccion.tieneFicha ? "pill-ok" : "pill-warn"}">${seleccion.tieneFicha ? "Ficha disponible" : "Ficha pendiente"}</span>
            </div>
            <div class="card-body stack">
              ${seleccion.fuente ? `
                <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">

                  <span class="small">${esc(seleccion.fuente.norma)} · ${esc(seleccion.fuente.anexo)}</span>
                  <span class="grow"></span>
                  <a class="btn btn-sm" href="${esc(seleccion.fuente.url)}" target="_blank" rel="noopener">Ver en el BOE</a>

                <details>
                  <summary class="small" style="cursor:pointer;font-weight:600">Sentido de la materia según el real decreto</summary>

                <div>
                  <h4 style="font-size:13.5px;margin-bottom:8px">Competencias específicas <span class="small muted">(${modelo.competencias.length}, comunes a la etapa)</span></h4>
                  ${modelo.competencias.map((ce) => `
                    <div class="ce">
                      <h4>${esc(ce.id.toUpperCase())}</h4>
                      <p>${esc(ce.texto)}</p>
                      ${ce.descriptores ? `<p class="small muted" style="margin-top:6px">Perfil de salida: ${esc(ce.descriptores)}</p>` : ""}
                      ${ce.explicacion.length ? `
                        <details style="margin-top:6px">
                          <summary class="small" style="cursor:pointer">Explicación de la competencia</summary>

                    </div>`).join("")}
                </div>` : `<p class="small muted">Este elemento aún no tiene competencias específicas registradas.</p>`}
              ${modelo.niveles.length ? `
                <div class="stack">
                  <h4 style="font-size:13.5px;margin-bottom:2px">Criterios de evaluación y saberes básicos</h4>

                    const criterios = Object.entries(bloque.criterios);
                    return `
                      <details style="border:1px solid var(--line);border-radius:10px;padding:10px 12px">

                          <strong>${esc(nivel.etiqueta)}</strong>
                          <span class="small muted">· ${criterios.reduce((s, [, l]) => s + l.length, 0)} criterios · ${bloque.saberes.length} saberes</span>

                        <div class="stack" style="margin-top:12px">

                            <div>
                              <div class="small" style="font-weight:600;margin-bottom:4px">${esc(ceId.toUpperCase())}</div>
                              <ul class="list-num">${lista.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
                            </div>`).join("")}
                          ${bloque.saberes.length ? `
                            <div>
                              <div class="small" style="font-weight:600;margin-bottom:4px">Saberes básicos</div>

              ${seleccion.notas && seleccion.notas.length ? `

                  <h4 style="font-size:13.5px;margin-bottom:6px">Notas</h4>
                  <ul class="list-num">${seleccion.notas.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
                </div>` : ""}
              <p class="small muted" style="border-top:1px solid var(--line);padding-top:12px">${esc(DATA.notaFicha || "")}</p>
            </div>` : `<div class="card-body"><p class="small muted">Selecciona un elemento del catálogo.</p></div>`}
        </div>
      </div>`;
  }

  function descargar(nombre, contenido, tipo) {
    const blob = new Blob([contenido], {type: tipo});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nombre;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
